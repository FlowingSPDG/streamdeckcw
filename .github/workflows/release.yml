name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Pack Stream Deck plugin
        run: npx streamdeck pack dev.flowingspdg.characterworks-node.sdPlugin --output .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dev.flowingspdg.characterworks-node.streamDeckPlugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

