<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Set Text</title>
		<meta charset="utf-8" />
		<!-- Use local copy of sdpi-components instead of CDN. -->
		<script src="./vendor/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Motion Name">
			<sdpi-textfield setting="motionName" placeholder="scorebug"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Text Layer">
			<sdpi-textfield
				setting="textLayer"
				placeholder="CW text layer variable to replace"
			></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Text Value">
			<sdpi-textfield setting="textValue" placeholder="Sample Text"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Channel">
			<sdpi-select setting="channel">
				<option value="live1">live1</option>
				<option value="live2">live2</option>
				<option value="preview" selected>preview</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Host">
			<sdpi-textfield setting="host" placeholder="127.0.0.1"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Port">
			<sdpi-textfield setting="port" placeholder="5201"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
