<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Activate Grid</title>
		<meta charset="utf-8" />
		<!-- Use local copy of sdpi-components instead of CDN. -->
		<script src="./vendor/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Grid Name">
			<sdpi-textfield setting="gridName" placeholder="Grid 1"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Grid Cell (row,column)">
			<sdpi-textfield setting="gridCell" placeholder="0,0"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Host">
			<sdpi-textfield setting="host" placeholder="127.0.0.1"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Port">
			<sdpi-textfield setting="port" placeholder="5201"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
