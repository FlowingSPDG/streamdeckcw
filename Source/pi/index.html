<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Character Works Settings</title>
	<link rel="stylesheet" href="sdpi.css">
</head>
<body>
	<div class="sdpi-wrapper">
		<div class="sdpi-item">
			<div class="sdpi-item-label">Host</div>
			<input class="sdpi-item-value" id="host" type="text" value="" placeholder="127.0.0.1" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Channel</div>
			<input class="sdpi-item-value" id="channel" type="text" value="" placeholder="1 or CH1" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Layer/Field</div>
			<input class="sdpi-item-value" id="layer" type="text" value="" placeholder="LAYER_NAME or field" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Value</div>
			<input class="sdpi-item-value" id="value" type="text" value="" placeholder="Text value" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Motion</div>
			<input class="sdpi-item-value" id="motion" type="text" value="" placeholder="Motion name" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Motion ID</div>
			<input class="sdpi-item-value" id="motionId" type="text" value="" placeholder="Motion ID" />
		</div>

		<div class="sdpi-item">
			<button class="sdpi-item-value" id="save">Save Settings</button>
		</div>
	</div>

	<script src="sdtools.common.js"></script>
	<script>
		const $SD = window.$SD;
		const PI = window.PI;

		// Load settings when PI appears
		$SD.on('connected', (jsn) => {
			$SD.getSettings();
		});

		// Handle settings received from plugin
		$SD.on('didReceiveSettings', (jsn) => {
			const settings = jsn.payload.settings;
			if (settings) {
				document.getElementById('host').value = settings.host || '';
				document.getElementById('channel').value = settings.channel || '';
				document.getElementById('layer').value = settings.layer || '';
				document.getElementById('value').value = settings.value || '';
				document.getElementById('motion').value = settings.motion || '';
				document.getElementById('motionId').value = settings.motionId || '';
			}
		});

		// Save settings when button clicked
		document.getElementById('save').addEventListener('click', () => {
			const settings = {
				host: document.getElementById('host').value,
				channel: document.getElementById('channel').value,
				layer: document.getElementById('layer').value,
				value: document.getElementById('value').value,
				motion: document.getElementById('motion').value,
				motionId: document.getElementById('motionId').value,
			};
			$SD.setSettings(settings);
		});

		// Auto-save on input change
		['host', 'channel', 'layer', 'value', 'motion', 'motionId'].forEach(id => {
			document.getElementById(id).addEventListener('input', () => {
				const settings = {
					host: document.getElementById('host').value,
					channel: document.getElementById('channel').value,
					layer: document.getElementById('layer').value,
					value: document.getElementById('value').value,
					motion: document.getElementById('motion').value,
					motionId: document.getElementById('motionId').value,
				};
				$SD.setSettings(settings);
			});
		});
	</script>
</body>
</html>
